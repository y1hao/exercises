coach_notes:
  evidence_policy: 先收集四步预测，再补一个与错误模型有关的缓存规则；不要一上来把所有命中答案列出。
  evaluation_focus:
  - 能沿输入和前序状态传播，而不是按“这一步自己的文件没变”逐步孤立判断。
  - 能区分Docker步骤缓存、依赖管理器缓存和最终文件内容。
  optional_followup: 若用户判断正确，给出明确反事实：pom.xml只改注释而依赖集合不变；这是否足以让Docker自动理解其语义并复用该COPY？不假装这就是原例发生过的改动。
