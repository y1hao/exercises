coach_notes:
  evidence_policy: 只按当前假说释放一项相关证据；核心机制未讨论前不提前给出commit-wait结论。
  evaluation_focus:
  - 能把时间不确定性接到提交可见性，而不只背诵TrueTime名称。
  - 能区分安全约束、算法选择与观测到的延迟，并说明预测条件。
  optional_followup: 若用户已给出正确机制，追问：通信等待已经更长时，增加时钟不确定性是否一定等量增加总延迟？这是条件推演，不是新的历史观测。
