    text: 新规则向上取整到1ms且无最短时长，官方展示27.55ms执行计为28ms；对该时长旧规则计为100ms。
    source_ids:
    - S1
    availability: pre_decision
  - id: E2
    text: 公告明确请求费用不变；调用数与时长分布会决定整月账单，单次时长取整节省不能直接外推总额。
    source_ids:
    - S1
    availability: pre_decision
  outcome:
    id: O1
    text: AWS从2020年12月账期向中国区之外区域实施1ms粒度，中国区从次年1月；文中示例日志展示新28ms计费时长。
    source_ids:
