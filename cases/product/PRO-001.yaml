historical_as_of: '2009-05-28'
as_of_basis: 2009开发者预览发布边界；开发者喝彩由2010公司回顾重建，只归属于当时的演示反应；2010采用与停止投入信息后置。
objective: 区分开发者对技术演示的反应与用户日常任务价值，用可区分竞争解释的行为证据安排下一项验证。
opening: 你以产品评审者的视角，回到2009年一款浏览器沟通工具的开发者预览。它把对话与共享文档放在同一空间，支持多人实时编辑、逐字看到别人输入、拖入文件以及回放修改历史。演示中的开发者热烈回应，但发布团队仍在探索这种沟通方式会被怎样使用。目前给你的材料只有功能与演示反应，没有日常使用和留存数据。请提出两个能解释这种反应的竞争假说，并选择一项后续用户行为证据，说明怎样用它区分两者。
opening_source_ids:
- S1
- S2
evidence_pool:
- id: E1
  availability: on_request
  historical_availability: pre_decision
  fact: 2009发布文说明用户创建一个wave并加入其他人，参与者可以直接回复或编辑，内容同时用于即时交流与持续保存，回放可查看形成过程。
  source_ids:
  - S2
  release_trigger: 用户需要把“觉得酷”具体化为某项反复发生的协作任务，或询问产品实际交互时。
  locator: 发布文对wave和playback的说明
- id: E2
  availability: on_request
  historical_availability: pre_decision
  fact: 这次提供的是开发者预览；公司邀请开发者利用API嵌入或扩展，公开面向普通用户的发布时间当时尚未确定。
  source_ids:
  - S2
  release_trigger: 用户把演示开发者的反应直接外推到普通团队采用，或需要检查样本与任务的关系时。
  locator: 开发者预览、平台API与末段公开发布时间说明
- id: E3
  availability: after_commitment
  historical_availability: post_decision
  fact: 2010负责人称产品有忠实用户，却未达到公司期望的采用水平；未公开这个阈值、分群或对照实验。
  source_ids:
  - S1
  release_trigger: 仅在用户已完成假说与证据选择、进入最终复盘时提供；这不是2009已知证据。
  locator: Update on Google Wave第4段
resolution:
  observed: Google于2010-08-04宣布不再把Wave作为独立产品继续开发，并表示保留开源技术、为内容迁出开发工具。公告自述采用未达预期，同时承认存在忠实用户。
  source_ids:
  - S1
  interpretation: 公司公告支持“采用未达公司预期”和停止独立投入，未识别唯一失败原因。维护者的诊断框架可比较“任务有价值但采用或协作迁移困难”与“主要吸引力是技术新鲜感”等解释；同一批真实团队在重复任务中的完成、协作对象参与和继续使用，可比一次喝彩更有区分力。这些是建议验证的观察，不是已有实验结果。
  unknowns:
  - 没有留存曲线、用户分群、可用性实验或准确成功阈值；不能断言复杂度、性能或需求中的某一项已被证明是主因。
  - 开场角色是练习视角，不是真实内部评审会议或某位决策者的原话。
boundaries:
  forbidden_assumptions:
  - 首轮不得给出2010停止投入、采用不足或用标题暗示失败。
  - 不得把开发者演示受众当成全部目标用户，也不得把忠实用户当成已证明大规模需求。
  - 合理假说只要仍缺区分证据就保留为未知；不要求用户猜中后来关闭决定。
  - 不得把建议收集的任务行为、留存或分群写成Google实际做过的实验。
