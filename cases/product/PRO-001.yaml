coach_notes:
  evidence_policy: 优先要求说清两种解释对同一行为的不同预期；若缺实际数据，明确未知，不把最后的停止开发当成中途诊断证据。
  evaluation_focus:
  - 假说在可观察行为上有差别，证据能改变判断。
  - 对样本外推与“功能存在—任务价值—采用规模”的跳跃保持边界。
  optional_followup: 若用户直接建议看留存，追问其分母应是看过演示的人、注册个人，还是已经尝试完成同一协作任务的团队；只选一个最有区分力的切口。
