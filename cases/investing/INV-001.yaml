coach_notes:
  evidence_policy: 先让用户选择分母并计算，再按其判断选择出售规模或潜在股份证据；只在最终阶段公布定价。
  evaluation_focus:
  - 单位、数量级和股数口径一致。
  - 能解释“按这个价格给整体权益定多少价”与“它值不值这个价”之间还缺什么。
  optional_followup: 若计算正确，询问：市场只出售约9550万份ADS，为什么仍用全部基本股数讨论整体权益价值？
