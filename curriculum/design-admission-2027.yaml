  out_of_scope: 不扩成完整产品/企业/平台设计；不保证全部目标无代价兼得；不预设唯一标准方案。
  reason: 逐题明确一项输出、可满足或可证明不兼得的约束和有辨识力的变化；保留Phase2已收窄的合成边界。
  admission: eligible
  admission_reason: 单一20分钟任务、显式合成假设、可评价约束及非唯一方案均已核对；只准入制作，不是完整Brief或训练QA。
  design_basis:
    synthetic: true
    assumptions:
    - 合成练习；场景中的组织、用户、金额、规模和政策都是题设，不是已发生事实。
    - 一款面向繁忙家长的手机应用希望用户在想到事情时快速记录，但新用户第一次打开时还没有数据；只能做三个首屏步骤。
    feasibility_reason: 可以在本地形成有用记录，允许账号或完整分类延后；不以后台连接作为首步硬前提。
    discriminating_change: 用户往往只有单手操作的十秒钟，并且会在离线时打开应用。
