  scenario_title: 双边预约产品的公平分配
  focus: constructive-design
  subdomain: marketplace-trust
  main_question: 紧缺预约下，候补与取消怎样处理平台外成交激励？
  expected_output: 一个分配/取消/争议的激励机制
  out_of_scope: 不扩成完整产品/企业/平台设计；不保证全部目标无代价兼得；不预设唯一标准方案。
  reason: 逐题明确一项输出、可满足或可证明不兼得的约束和有辨识力的变化；保留Phase2已收窄的合成边界。
  admission: eligible
  admission_reason: 单一20分钟任务、显式合成假设、可评价约束及非唯一方案均已核对；只准入制作，不是完整Brief或训练QA。
  design_basis:
    synthetic: true
    assumptions:
    - 合成练习；场景中的组织、用户、金额、规模和政策都是题设，不是已发生事实。
    - 一个平台让用户预约紧缺的线下专业服务；优质服务者希望高利润订单，平台又希望新用户不会长期抢不到名额。
    feasibility_reason: 允许有限配额和显式规则；不要求零绕单与无限用户自由同时成立。
    discriminating_change: 部分服务者尝试引导客户绕过平台直接成交。
    evaluation_basis:
    - 输出是否覆盖当前约束和责任边界
    - 变化是否揭露原方案关键假设，而不是无关加难
    - 能说明不满足条件时的失败、拒绝或恢复路径
    acceptable_tradeoffs: 公平、效率与执行成本可权衡
