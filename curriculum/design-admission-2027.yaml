  design_basis:
    synthetic: true
    assumptions:
    - 合成练习；场景中的组织、用户、金额、规模和政策都是题设，不是已发生事实。
    - 公司要为不同语言的服务提供统一 tracing SDK，目标是让开发者几行代码即可接入，生产环境请求量相差一千倍。
