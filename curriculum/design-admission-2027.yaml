  design_basis:
    synthetic: true
    assumptions:
    - 合成练习；场景中的组织、用户、金额、规模和政策都是题设，不是已发生事实。
    - 一个日程产品希望从个人用户扩展到 5–30 人团队，但团队已经使用成熟的日历工具，不愿整体迁移。
    feasibility_reason: 禁止读企业日历不禁止显式输入或局部共享；可限定任务，不能暗中假定读权限。
