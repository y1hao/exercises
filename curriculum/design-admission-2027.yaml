- id: DES-051
  decision: reframe
  scenario_title: 巨头捆绑下的两条可验证路线
  focus: constructive-design
  subdomain: competitive-positioning
  main_question: 巨头免费捆绑且客户依赖其生态时，小团队应怎样选择位置？
  expected_output: 一个两季可验证的定位选择
  out_of_scope: 不扩成完整产品/企业/平台设计；不保证全部目标无代价兼得；不预设唯一标准方案。
  reason: 逐题明确一项输出、可满足或可证明不兼得的约束和有辨识力的变化；保留Phase2已收窄的合成边界。
  admission: eligible
  admission_reason: 单一20分钟任务、显式合成假设、可评价约束及非唯一方案均已核对；只准入制作，不是完整Brief或训练QA。
  design_basis:
    synthetic: true
    assumptions:
    - 合成练习；场景中的组织、用户、金额、规模和政策都是题设，不是已发生事实。
    - 保留 15 人与两季约束，只比较两条可执行路线。
    - 收购不是已存在的报价或可保证退出，不作为资金兜底。
    - 团队只能优先验证一条路线，可说明另一条在什么条件下更合理。
    feasibility_reason: 沿用Phase2有限人手与合成依赖比例；允许只选一条主路线，不要求同时探索四种战略。
    discriminating_change: 三成主要客户高度依赖该云厂商，合作也可能进一步增强渠道依赖。
    evaluation_basis:
    - 输出是否覆盖当前约束和责任边界
    - 变化是否揭露原方案关键假设，而不是无关加难
    - 能说明不满足条件时的失败、拒绝或恢复路径
    acceptable_tradeoffs: 垂直价值、集成分发和渠道依赖可权衡
