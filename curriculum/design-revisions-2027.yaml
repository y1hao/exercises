phase: 2
scope: planning_revision_not_ready_brief
entries:
  - id: DES-016
    title: 跟投与桥接的资本优先级
    main_question: 剩余可投资金应按什么顺序在新投资与两类跟投之间作决策？
    expected_output: 一份有停止条件的资本优先级规则，不给最优仓位。
    scenario: 基金规模与剩余资金沿用原合成题，只比较高估值跟投和桥接融资两个待选动作。
    planning_assumptions:
      - 1800 万美元是扣除管理费用及已签承诺后的可部署余额。
      - 两项待选交易均无强制跟投义务，没有未披露的担保或杠杆。
      - 交易具体价格和权利未提供，应指出它们如何改变优先级，不能自行补数字。
    scoped_change: 高增长公司要求本轮跟投，同时另一核心持仓请求桥接资金。
    out_of_scope: 不精算基金最佳收益率，不比较所有已投企业或设计完整基金策略。
  - id: DES-020
    title: 稀有错误追踪的保留取舍
    main_question: 预算有限时，如何保留排查服务错误所需的 trace 数据？
    expected_output: 一项保留或采样策略、一个可回答查询和一个无法回答查询。
    scenario: 只处理最近一天的按服务错误请求追踪，不覆盖任意用户路径和全部 APM 查询。
    planning_assumptions:
      - 流量数量级沿用原合成场景，不作为任何公司的实际数据。
      - 可在采样、保留窗口与索引范围间取舍，不要求同时保留全部原始 spans。
    scoped_change: 用户要求找出一天前一次极少发生的错误调用链。
    out_of_scope: 不设计完整 APM 存储平台，不要求固定预算下保证找回任意稀有请求。
  - id: DES-026
    title: 远程 workspace 的中断恢复边界
    main_question: 临时 workspace 中断后，如何保留并恢复未提交修改？
    expected_output: 一个包含创建、暂停、恢复、销毁的最小生命周期和明确的数据归属。
    scenario: 将首要问题改为中断恢复；基础镜像、计算配额和计价方式固定为外部给定条件。
    planning_assumptions:
      - 只允许在同一团队的隔离存储内恢复 workspace 数据。
      - 不共享凭据；仅把已存在的无凭据构建缓存当作输入，不设计缓存优化。
      - 可以暂停计算并保留用户修改；保留期限和恢复目标需要方案明确声明。
    scoped_change: 任务结束后用户要求立即销毁 workspace，仍须明确哪些修改会随之丢失。
    out_of_scope: 不同时优化启动、设计缓存系统或制定计费模型。
  - id: DES-028
    title: 行政表单草稿的人工确认边界
    main_question: 在明确的试点规则下，AI 表单服务应把自动化停在哪个边界？
    expected_output: 一个可销售的行政任务范围和人工确认节点。
    scenario: 仅处理诊所行政表单草稿，不作诊断、治疗或真实合规法律判断。
    planning_assumptions:
      - 这是合成试点政策：系统不得自动写入正式病历，获授权人员必须确认提交。
      - 试点仅允许已获授权的数据进入受控环境，不推断任何司法辖区的实际法规。
    scoped_change: 客户把自动写入正式病历作为付款条件；政策保持不变，允许拒绝或重新界定服务。
    out_of_scope: 不要求用户猜法律、承诺零错误或设计完整医疗信息系统。
  - id: DES-035
    title: 小型缺陷修复的 agent 回归门槛
    main_question: 如何判断一次 agent 提示词修改是否损害了修复小型缺陷的能力？
    expected_output: 一个可重复任务单元、一条回归门槛和一种失败分型。
    scenario: 仅评估带已有失败测试的小型单仓库缺陷修复，不评所有 coding agent 能力。
    planning_assumptions:
      - 任务输入、工具权限、可见测试和执行预算需要固定。
      - 模型重复运行有波动，单次得分不自动代表能力变化。
    scoped_change: 供应商版本变化使同一任务结果更不稳定，但平均成功率暂时提高。
    out_of_scope: 不设计全能 benchmark，不要求维护庞大人工题库或实际运行实验。
  - id: DES-039
    title: 权限变更审计的身份与保留边界
    main_question: 租户管理员变更权限时，审计事件该记录什么并向谁开放？
    expected_output: 一个最小事件结构和一条删除或保留边界。
    scenario: 仅审计管理员修改成员权限的动作，不包含普通应用日志。
    planning_assumptions:
      - 合成保留政策要求保留动作、时间、结果和可关联的操作者标识，不要求永久保存原始个人资料。
      - 身份映射与事件内容可采用不同存储和权限；记录完整性并不等同于法律不可抵赖结论。
    scoped_change: 客户要求删除成员可识别资料，但保留权限变更事件的完整性。
    out_of_scope: 不判断实际法定期限，不让删除个人信息被预设为必然破坏所有审计能力。
  - id: DES-041
    title: 有限容量下的事件接收承诺
    main_question: 下游不可用时，入口应在什么条件下拒绝接收新事件？
    expected_output: 一条接收确认边界、有限缓冲策略和无解条件。
    scenario: 只处理入口到一个下游的事件交付，内存和持久化容量都有限。
    planning_assumptions:
      - 可以在正式接受事件前返回明确拒绝；上游无法重试时，端到端不丢失可能无法保证。
      - 确认接受后的事件有明确持久化责任，不允许以静默丢弃冒充已交付。
      - 允许方案证明在给定资源和持续输入下要求不可同时满足。
    scoped_change: 下游连续一天不可用，上游仍持续发送且不能安全重试。
    out_of_scope: 不引入无限磁盘，不要求在矛盾条件下保证所有数据永不丢失。
  - id: DES-042
    title: 一笔硬件订单的现金缺口
    main_question: 一笔先垫付设备的订单会在什么时候耗尽可用现金？
    expected_output: 一个最小现金时序和一项订单接受条件。
    scenario: 只比较一笔农场客户订单，不为整个公司设计资本结构。
    planning_assumptions:
      - 以下均为合成练习参数：可用现金 12 万元，订单硬件及安装须在第 0 月支付 8 万元。
      - 客户从第 3 月开始每月支付 1 万元，每月相关服务现金成本 2000 元；不计其他收入或费用。
      - 多年合同不自动等于可用现金，能否取得预付款或融资只是待谈条件。
    scoped_change: 客户要求设备安装成本在第 0 月额外增加 5 万元，付款节奏不变。
    out_of_scope: 不计算企业估值或假定贷款一定获批；本题参数不得迁移为真实公司的历史事实。
  - id: DES-051
    title: 巨头捆绑下的两条可验证路线
    main_question: 巨头免费捆绑后，小团队应优先垂直聚焦还是集成合作？
    expected_output: 两条路线的一个比较、停止条件和两季内的验证动作。
    scenario: 保留 15 人与两季约束，只比较两条可执行路线。
    planning_assumptions:
      - 收购不是已存在的报价或可保证退出，不作为资金兜底。
      - 团队只能优先验证一条路线，可说明另一条在什么条件下更合理。
    scoped_change: 三成主要客户高度依赖该云厂商，合作也可能进一步增强渠道依赖。
    out_of_scope: 不同时规划开放标准、收购、垂直化和合作四个完整战略。
