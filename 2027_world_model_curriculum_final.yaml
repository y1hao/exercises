title: 2027 世界模型训练 · 精简年度课程
year: 2027
timezone: Pacific/Auckland
curriculum_version: 2026-10-25-curated-v1
principle: 提前规划案例分布与训练重点；每次训练由独立 session 当场查找来源、验证事实、动态提问和复盘。这里的历史来源为研究入口，不是预先认证的完整证据包。
schedule:
  monday_wednesday_friday: 工程历史案例
  tuesday_thursday: 产品历史案例
  saturday: 投资与创业历史案例
  sunday: 微设计
  session_minutes_target: 20
counts:
  engineering_history: 157
  product_history: 104
  investing_history: 52
  micro_design: 52
training_guidance: >-
  每次只取当日条目。历史案例从案例背景与训练重点出发，先核实基本事件和历史决策时点，再由用户先判断、教练逐轮检索真实证据、最后复盘实际结果及未知；不把缺少精确原始数据视为自动弃题，也不虚构数据。微设计以明确合成场景开场，由用户先提出方案，再针对方案给出合理扰动与评价。
revision_review:
- id: PRO-001
  decision: restore
  reason: Notion 早期重做存在创始人及投资者回顾；原先要求同期细粒度用户证据过严。恢复原主题并明确技术可靠性与定位的不确定性。
- id: PRO-013
  decision: restore_with_caveat
  reason: Craigslist 相关分发实践有多方历史材料，但对 Airbnb 增长贡献大小有争议；作为渠道与归因题而非确定增长奇迹。
- id: ENG-054
  decision: correct_original
  reason: 没有可靠依据称 Google 自身在2012年遭该 Linux 闰秒故障；改为 Google 有官方材料的 leap smear 预防设计。
- id: PRO-059
  decision: restore
  reason: Zappos 创始人对早期鞋店拍照与履约实验有一手回顾；无需当时完整运营指标也能训练实验设计。
- id: INV-034
  decision: keep_replacement
  reason: Superhuman 融资题与已有产品 PMF 调查高度重叠且缺独立投资信息；Chegg 的 AI 替代冲击更能增加全年机制覆盖。
- id: ENG-117
  decision: keep_replacement
  reason: 原 ZippyDB SSD 单次优化节点模糊；RocksDB Ribbon Filter 有更可定位的技术机制且不重复其它题。
- id: PRO-082
  decision: restore
  reason: Twitter/X 更名与定位转变是真实且高价值的战略决策；无法精确识别品牌的独立因果效应不构成弃题理由。
- id: PRO-093
  decision: restore
  reason: Clubhouse 邀请准入和增长阶段有公开资料，适合训练增长与留存机制辨析；不预设稀缺导致留存。
- id: ENG-157
  decision: keep_replacement
  reason: 原 Blaze 2015 与 ENG-080 构建依赖题重复；Rust 1.52.1 是独立且有一手材料的发布/安全取舍。
exercises:
- id: ENG-001
  date: '2027-01-01'
  kind: historical
  domain: engineering
  subdomain: distributed_consistency
  case: Google Spanner（2012）
  briefing: 面对跨地区事务与外部一致性需求，判断 TrueTime 的时钟不确定性如何影响提交等待。
  focus: 因果机制推演
  research_hint: 'Spanner: Google’s Globally-Distributed Database (OSDI 2012)'
- id: INV-001
  date: '2027-01-02'
  kind: historical
  domain: investing
  subdomain: valuation_terms
  case: Arm 2023 IPO 估值
  briefing: 高度依赖芯片授权和版税的商业模式，如何评估增长、客户集中与价格。
  focus: 约束下的决策取舍
  research_hint: Arm 2023 F-1
- id: DES-001
  date: '2027-01-03'
  kind: micro_design
  domain: engineering
  subdomain: api_sdk
  case: 平台资源 API 的抽象边界
  briefing: 一家拥有 80 个服务团队的公司准备提供自助申请数据库和消息队列的内部平台；底层云服务会更换，团队不应编写基础设施配置。
  focus: 设计一版面向应用开发者的最小资源 API：选定 2–3 个核心对象、声明哪些细节可见，并解释哪些能力明确不做。
  optional_pressure_test: 安全团队要求每次资源权限变更都可独立审核，而服务团队要求一次声明即可完成部署。
- id: ENG-002
  date: '2027-01-04'
  kind: historical
  domain: engineering
  subdomain: developer_tooling_build
  case: Docker 分层构建与缓存边界（2019）
  briefing: >-
    Dockerfile 通过逐层构建与复用缓存提高开发迭代效率。以 Docker 官方2019年的多阶段构建教程为具体锚点，比较依赖声明、源码和编译产物在不同改动下的重建范围，再推演缓存正确性与构建效率之间的取舍。
  focus: 条件预测与反事实
  research_hint: Docker official 2019 Dockerfile best practices tutorial
- id: PRO-001
  date: '2027-01-05'
  kind: historical
  domain: product
  subdomain: user_research_value
  case: Notion 2015–2016 产品与技术重做
  briefing: Notion 早期尝试把可组合的计算能力带入通用工作工具，却遭遇技术稳定性、产品定位和有限现金等约束。站在决定削减团队、重新开发产品之前，评估是继续修补还是重构，以及应该用哪些用户与技术证据区分问题。
  focus: 问题诊断与战略取舍：区分用户需求、交互复杂度和实现可靠性，不把后来的成功当作事前必然。
  research_hint: First Round Notion founding story; Ivan Zhao interviews about 2015 rewrite
