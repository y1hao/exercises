basis: candidate_text_only_not_verified_history
clusters:
  - id: EV-01
    category: event_or_mechanism_overlap
    ids: [ENG-080, ENG-157]
    assessment: 同一 2015 年 Blaze/Bazel 背景，均以构建输入和缓存正确性为核心，尚无不同决策节点。
    action: 保留 ENG-080；ENG-157 标为 replace，保留原槽位与素材，待 Phase 3 核实并选择替代事件。
    pending: 替代案例名称与来源尚未确定，不把建议视为已换题。
  - id: EV-02
    category: event_identity_uncertain
    ids: [ENG-011, ENG-040]
    assessment: 一个标题捆绑 2023—2024 供电事件，另一个明确指向 2023 年 11 月控制面中断；候选文本不能证明相互独立。
    action: ENG-011 标为 revise；核实是否存在独立的另一事件和决策，否则作为第二个替换候选。
    pending: 不依据年份相近直接断言重复；需复盘时间线。
  - id: EV-03
    category: repeated_evidence_risk
    ids: [PRO-080, INV-034]
    assessment: 两题都依赖 Superhuman 分群 PMF 调查；换成投资视角本身不足以形成独立认知练习。
    action: 保留产品题的路线图证据选择；投资题必须转为融资时的商业质量估计并有独立材料，否则替换。
    pending: 真实融资时点、价格与商业数据需 Phase 3 核实。
  - id: EV-04
    category: related_chain_identity_uncertain
    ids: [ENG-015, ENG-143]
    assessment: 都涉及 2023 年第三方身份或凭据风险，可能相关但公司、暴露路径与时点描述不同。
    action: 分别核对凭据泄露、支持文件和后续入侵的事件身份；不得借另一条事件的事实补齐。
    pending: 只识别候选叙述相邻，不认定为同一攻击或已验证因果链。
  - id: ME-01
    category: mechanism_neighbors
    ids: [ENG-002, ENG-025, ENG-032, ENG-059, ENG-080, ENG-127, ENG-149, ENG-157]
    assessment: 构建输入、缓存失效和信任假设高度接近，不能只更换构建工具名称。
    action: 分别限定 Dockerfile 层级、未声明环境输入、引导信任、远端 action、依赖图、细粒度计算失效、CI 信任；ENG-157 待替换。
  - id: ME-02
    category: mechanism_neighbors
    ids: [ENG-053, ENG-100, ENG-121, ENG-134, ENG-141, DES-012]
    assessment: 都涉及增量或缓存，但图节点、正确性承诺与缓存阶段不同。
    action: 区分受影响任务、类型依赖、自动推导回退、配置副作用、语法树范围；设计题只构造不完整图的保守回退。
  - id: ME-03
    category: mechanism_neighbors
    ids: [ENG-004, ENG-071, DES-001]
    assessment: 基础设施 provider、平台组合和面向开发者 API 都围绕抽象边界。
    action: 历史题分别检查协议兼容与组合泄漏；设计题只构造两类资源的最小对象，避免三次同样的平台设计。
  - id: ME-04
    category: mechanism_neighbors
    ids: [ENG-009, ENG-058, ENG-092, ENG-113]
    assessment: 多种 leader/复制恢复主题有变成同一个 quorum 常识题的风险。
    action: 分别保留日志安全、ISR 配置、未提交 proposal 恢复和灾难恢复选择，固定版本与单次时序。
  - id: ME-05
    category: mechanism_neighbors
    ids: [ENG-031, ENG-037, ENG-085, ENG-099, ENG-126, ENG-133]
    assessment: 多个数据库一致性题需要真实不同的失败与冲突机制。
    action: 以 acknowledged 写入、异步主从切换、事务重试、乐观冲突、残留锁、quorum 修复分别作为唯一主动作材料。
  - id: ME-06
    category: mechanism_neighbors
    ids: [ENG-063, ENG-103, ENG-112, ENG-129]
    assessment: async、事件循环和回调顺序易退化为术语比较。
    action: 区分取消释放、同步阻塞、线程池回调与微任务次序，每题只用一个可推演时序。
  - id: ME-07
    category: mechanism_neighbors
    ids: [ENG-012, DES-014, DES-044]
    assessment: 都有新旧版本共存，但数据迁移、线协议和异步 consumer 的硬约束不同。
    action: 保留字段兼容预测、在线存储回滚、长期旧 consumer 三个不同边界。
  - id: ME-08
    category: mechanism_neighbors
    ids: [ENG-120, ENG-138, DES-003, DES-008, DES-046]
    assessment: ack、重试、去重和不可逆副作用反复出现。
    action: 分开持久流语义、支付幂等请求、跨步恢复、worker 确认与外部 webhook 止损，不能重复同一 exactly-once 口号。
  - id: ME-09
    category: mechanism_neighbors
    ids: [ENG-049, ENG-156, DES-027]
    assessment: 声明式对象、幂等协调和跨区生效都是控制面主题。
    action: 分别训练责任链解释、重复执行预测与发布成功定义，不重复设计一个通用 controller。
  - id: ME-10
    category: cross_domain_adjacent_decisions
    ids: [ENG-006, PRO-011, PRO-028, PRO-070, PRO-088, PRO-097, INV-010, DES-036]
    assessment: Figma 相关选题较多，但数据模型、计费、评论、光标、定位、采购和融资可形成不同问题。
    action: 保留领域差异，逐条固定不同功能/时间/决定；不得重复同一浏览器协作成功叙事。
  - id: ME-11
    category: same_company_distinct_decisions
    ids: [PRO-005, PRO-032, PRO-035, PRO-102, ENG-150, INV-051]
    assessment: Dropbox 推荐、需求验证、容量收费、同步交互、自建存储和财务毛利是不同节点。
    action: 保留选题但拆开证据范围，特别防止工程成本与投资毛利复盘直接重复。
  - id: ME-12
    category: cross_domain_adjacent_decisions
    ids: [PRO-040, INV-044, INV-045]
    assessment: DoorDash 早期市场、早期融资与上市前财务可区分，当前标题跨度仍较宽。
    action: 分别限定单区履约、跨城市外推和报表口径，不把后来规模作为早期可见证据。
  - id: ME-13
    category: same_company_distinct_decisions
    ids: [PRO-009, PRO-047, PRO-071, PRO-079]
    assessment: Netflix 邮寄、流媒体、订阅和拆分捆绑是不同决策；不能合成一条事后成功路线。
    action: 固定各自公告/试验时点和初始信息，不提前展示后续产品变迁。
  - id: ME-14
    category: mechanism_neighbors
    ids: [PRO-085, PRO-094, PRO-096]
    assessment: 邀请链接带来采用的机制相近，但转化环节不同。
    action: 区分受邀者成为发起者、加入会议的注册摩擦、双方预约协调，防止同一“免注册更好”答案。
  - id: ME-15
    category: mechanism_neighbors
    ids: [PRO-018, PRO-078]
    assessment: 内容短暂性可能产生相似的表达压力推理。
    action: 保留私信与公开/半公开创作的不同受众边界，不只更换应用名称。
  - id: ME-16
    category: mechanism_neighbors
    ids: [PRO-016, PRO-051, PRO-089, INV-035, INV-052, DES-009, DES-024]
    assessment: 开源采用到企业价值捕获在多个产品和投资题出现。
    action: 区分托管责任、治理采购、部署选项、云竞争、付费 PMF、首个渠道与商业边界；不可全都问 SSO 是否值得收费。
  - id: ME-17
    category: mechanism_neighbors
    ids: [DES-010, DES-025, DES-043]
    assessment: 三个低频产品题都可能变成不追求 DAU 的同一结论。
    action: 分别构造购买决策复用、季节性暂停和顾问更替重入的交付物。
  - id: ME-18
    category: mechanism_neighbors
    ids: [INV-027, INV-033]
    assessment: 两个餐盒业务都强调 cohort 与 CAC，适合作机制对照但不能复制数字换公司。
    action: 对照高频履约损耗与高 churn 留存，独立核实各自进入时点与报表，允许不同结论。
  - id: ME-19
    category: mechanism_neighbors
    ids: [DES-022, DES-045, PRO-099]
    assessment: Marketplace 信任和激励相邻，评价、紧缺分配和早期信誉制度应分清。
    action: 分别输出差评申诉、候补取消、交易信任因果模型，不合成完整市场治理方案。
  - id: ME-20
    category: mechanism_neighbors
    ids: [ENG-034, ENG-043]
    assessment: 两个 CPU 侧信道题若只问权限模型都会趋同。
    action: 分开攻击前提、隔离代价与推测执行观察边界；不得把两种漏洞混作一个事实链。
  - id: ME-21
    category: mechanism_neighbors
    ids: [ENG-026, ENG-061, ENG-082, ENG-104, ENG-125, ENG-155]
    assessment: Cloudflare 部署、配置和依赖故障密集，真实事件可能独立但“配置导致全网故障”的答案高度接近。
    action: 逐条核实标题与时间，分开权限诊断、保护误伤、存储依赖、特征数据、CPU 规则和解析灰度证据；不把同公司等同重复事件。
