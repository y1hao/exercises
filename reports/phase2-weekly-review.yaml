basis: candidate_scope_and_textual_density_only
weeks:
  2027-W05: 三个约束决策分别是 compaction、地理索引和危机融资，决策对象不同；保留日历，后续开场分别只给一个资源或现金约束。
  2027-W07: 三个约束决策分别是 Craigslist 渠道依赖、去 GIL 和 Wii 用户定位；保持获客自主性、技术兼容性和差异化体验三个不同约束。
  2027-W08: 因果动作集中于 PR 权限、Etsy 特色供给与 Aurora 恢复；机制不同，分别保留信任链、本地匹配和持久化契约。
  2027-W13: 两个 Cloudflare 候选分别为 Pingora 资源效率和供电下控制面边界；无需因同公司合并，保持性能估算与故障边界分离，具体史实待核源。
  2027-W15: Microsoft 的 Windows Phone 退出与 .NET worker 测量无事件重叠；三个预测涉及缓存传播、联系人网络和 feature 合并，保留不同可观察输出。
  2027-W19: 三个数量题分别计 API 请求、邮件传播系数和银行 IPO 情景；保留日历，避免连续三题都写成无来源的数字练习。
  2027-W24: 三个边界题分别是平台组合抽象、版本控制职责和可观测性壁垒；从接口、工作流、竞争三层分开，不重复泛问抽象利弊。
  2027-W25: 六个历史题集中为三次决策和三次数量估计；对象为资源超售、会议收费、恢复路线、人工引导、索引去重和递延收入，材料须控制计算负担。
  2027-W26: 两个 Kubernetes 题为连接权限漏洞与 EndpointSlice 生效时序，故障前提和版本不同；保留日期，不让漏洞结果提示传播题。
  2027-W29: 三个决策分别是代码仓治理、BlackBerry 硬件退出和 io_uring 采用，主要约束不同；保留原日历，避免统一套用同一优缺点清单。
  2027-W32: Google Maps 任务闭环和共享身份故障无共同决策；保留同周，首轮需要独立背景，不能借品牌形成单一成功叙事。
  2027-W35: Figma 多人光标与合成协作套餐同属协作机制簇，但分别解释交互价值与构造收费激励；设计题不是 Figma 历史，不借真实套餐作为标准答案。
  2027-W40: F1 查询职责、持久流投递语义和网络平台壁垒是三种边界；保留日历，但历史题只检查一个接口或竞争条件。
  2027-W45: 配置缓存副作用、维护权交接和 FTX 尽调都选证据，但需要不同可证伪量；禁止只让教练反复问“还要什么数据”。
  2027-W49: React Hooks 与 Facebook 网络中断仅有实体关联；两者分别推演闭包状态和选择恢复路径，不应以同公司认定重复。
  2027-W50: Dropbox 自建对象存储和上市前毛利同周且可能复用成本材料；工程题限定自建阈值，投资题必须额外检验套餐和客户结构，独立材料不足时再提议调题或换题。
