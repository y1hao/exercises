  distinctness_clusters: []
  planned_exercise:
    planning_only: true
    synthetic: true
    title: 有限容量下的事件接收承诺
    main_question: 下游不可用时，入口应在什么条件下拒绝接收新事件？
    expected_output: 一条接收确认边界、有限缓冲策略和无解条件。
    scenario: 只处理入口到一个下游的事件交付，内存和持久化容量都有限。
    planning_assumptions:
    - 可以在正式接受事件前返回明确拒绝；上游无法重试时，端到端不丢失可能无法保证。
    - 确认接受后的事件有明确持久化责任，不允许以静默丢弃冒充已交付。
    - 允许方案证明在给定资源和持续输入下要求不可同时满足。
    scoped_change: 下游连续一天不可用，上游仍持续发送且不能安全重试。
    out_of_scope: 不引入无限磁盘，不要求在矛盾条件下保证所有数据永不丢失。
active_scope:
  decision: reframe
  main_question: 有限缓冲且下游停一天时，入口何时必须拒收？
  expected_output: 一份接收/拒收语义与不可兼得证明
  out_of_scope: 不扩成完整产品/企业/平台设计；不保证全部目标无代价兼得；不预设唯一标准方案。
  reason: 逐题明确一项输出、可满足或可证明不兼得的约束和有辨识力的变化；保留Phase2已收窄的合成边界。
  record_path: curriculum/design-admission-2027.yaml
  design_basis:
    synthetic: true
    assumptions:
    - 合成练习；场景中的组织、用户、金额、规模和政策都是题设，不是已发生事实。
    - 只处理入口到一个下游的事件交付，内存和持久化容量都有限。
    - 可以在正式接受事件前返回明确拒绝；上游无法重试时，端到端不丢失可能无法保证。
    - 确认接受后的事件有明确持久化责任，不允许以静默丢弃冒充已交付。
    - 允许方案证明在给定资源和持续输入下要求不可同时满足。
    feasibility_reason: 允许证明有限容量、持续输入和全量不丢不能兼得；拒收是有效答案，不偷偷添加无限存储。
    discriminating_change: 下游连续一天不可用，上游仍持续发送且不能安全重试。
    evaluation_basis:
    - 输出是否覆盖当前约束和责任边界
    - 变化是否揭露原方案关键假设，而不是无关加难
    - 能说明不满足条件时的失败、拒绝或恢复路径
    acceptable_tradeoffs: 背压、丢弃级别与持久化成本可取舍
