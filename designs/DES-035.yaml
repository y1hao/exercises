    title: 小型缺陷修复的 agent 回归门槛
    main_question: 如何判断一次 agent 提示词修改是否损害了修复小型缺陷的能力？
    expected_output: 一个可重复任务单元、一条回归门槛和一种失败分型。
    scenario: 仅评估带已有失败测试的小型单仓库缺陷修复，不评所有 coding agent 能力。
    planning_assumptions:
    - 任务输入、工具权限、可见测试和执行预算需要固定。
    - 模型重复运行有波动，单次得分不自动代表能力变化。
    scoped_change: 供应商版本变化使同一任务结果更不稳定，但平均成功率暂时提高。
    out_of_scope: 不设计全能 benchmark，不要求维护庞大人工题库或实际运行实验。
active_scope:
  decision: reframe
  main_question: 提示词改动与模型波动并存时，怎样判断缺陷修复能力退化？
  expected_output: 一个配对验证与判退规则
  out_of_scope: 不扩成完整产品/企业/平台设计；不保证全部目标无代价兼得；不预设唯一标准方案。
  reason: 逐题明确一项输出、可满足或可证明不兼得的约束和有辨识力的变化；保留Phase2已收窄的合成边界。
  record_path: curriculum/design-admission-2027.yaml
  design_basis:
    synthetic: true
    assumptions:
    - 合成练习；场景中的组织、用户、金额、规模和政策都是题设，不是已发生事实。
    - 仅评估带已有失败测试的小型单仓库缺陷修复，不评所有 coding agent 能力。
    - 任务输入、工具权限、可见测试和执行预算需要固定。
    - 模型重复运行有波动，单次得分不自动代表能力变化。
    feasibility_reason: 沿用Phase2合成小任务范围；可以报告不确定性，不把均值变化当全任务能力改进。
    discriminating_change: 供应商版本变化使同一任务结果更不稳定，但平均成功率暂时提高。
