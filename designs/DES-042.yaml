  planned_exercise:
    planning_only: true
    synthetic: true
    title: 一笔硬件订单的现金缺口
    main_question: 一笔先垫付设备的订单会在什么时候耗尽可用现金？
    expected_output: 一个最小现金时序和一项订单接受条件。
    scenario: 只比较一笔农场客户订单，不为整个公司设计资本结构。
    planning_assumptions:
    - 以下均为合成练习参数：可用现金 12 万元，订单硬件及安装须在第 0 月支付 8 万元。
    - 客户从第 3 月开始每月支付 1 万元，每月相关服务现金成本 2000 元；不计其他收入或费用。
    - 多年合同不自动等于可用现金，能否取得预付款或融资只是待谈条件。
    scoped_change: 客户要求设备安装成本在第 0 月额外增加 5 万元，付款节奏不变。
    out_of_scope: 不计算企业估值或假定贷款一定获批；本题参数不得迁移为真实公司的历史事实。
active_scope:
  decision: reframe
  main_question: 先垫设备的单笔订单怎样改变可用现金的最低点？
  expected_output: 一张有限时间轴与可接受承诺边界
  out_of_scope: 不扩成完整产品/企业/平台设计；不保证全部目标无代价兼得；不预设唯一标准方案。
  reason: 逐题明确一项输出、可满足或可证明不兼得的约束和有辨识力的变化；保留Phase2已收窄的合成边界。
  record_path: curriculum/design-admission-2027.yaml
  design_basis:
    synthetic: true
    assumptions:
    - 合成练习；场景中的组织、用户、金额、规模和政策都是题设，不是已发生事实。
    - 只比较一笔农场客户订单，不为整个公司设计资本结构。
    - 以下均为合成练习参数：可用现金 12 万元，订单硬件及安装须在第 0 月支付 8 万元。
    - 客户从第 3 月开始每月支付 1 万元，每月相关服务现金成本 2000 元；不计其他收入或费用。
    - 多年合同不自动等于可用现金，能否取得预付款或融资只是待谈条件。
    feasibility_reason: 沿用Phase2全部合成金额与付款时间，不凭空补贷款；可拒单或调整付款而非必须扩张。
    discriminating_change: 客户要求设备安装成本在第 0 月额外增加 5 万元，付款节奏不变。
    evaluation_basis:
    - 输出是否覆盖当前约束和责任边界
    - 变化是否揭露原方案关键假设，而不是无关加难
    - 能说明不满足条件时的失败、拒绝或恢复路径
    acceptable_tradeoffs: 预付款、交付批次与融资代价可取舍
