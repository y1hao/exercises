    evaluation_basis:
    - 输出是否覆盖当前约束和责任边界
    - 变化是否揭露原方案关键假设，而不是无关加难
    - 能说明不满足条件时的失败、拒绝或恢复路径
    acceptable_tradeoffs: 保留期权与集中支持均可辩护
