objective: 用最少API对象分清资源意图、平台实现与授权变更的责任，并检验独立审批能否与一次声明共存。
opening: 这是一道合成微设计题：一家有80个服务团队的公司要做内部自助平台，让团队申请数据库和消息队列。服务团队只声明自己需要什么，不编写云厂商的基础设施配置；平台负责把声明落到实际资源，底层云服务以后可能更换。资源创建允许异步完成，失败也必须能被团队看见。本轮只讨论API对象和责任边界，不设计完整部署系统。请用2—3个对象给出最小接口草案：写出各对象的关键字段、由谁修改，以及它向调用方承诺什么。
initial_constraints:
- 以下组织、人数、流程与政策均为合成题设，不是某家公司的历史事实。
- 平台服务80个团队，支持数据库和消息队列两类资源；团队提交的是逻辑需求而非云厂商基础设施配置。
- 底层云服务可替换；供应商特有的配置由平台负责映射，通用接口不能假定能表达所有厂商功能。
- 资源创建允许异步；调用方应能分辨申请已受理、仍在处理、已可用与失败，具体状态命名由用户决定。
- 对象需说明所属团队及修改权限；本轮不要求跨资源原子创建或完整计费、调度、容灾实现。
perturbations:
- id: P1
  change: 新增合成约束：安全团队要求每次资源权限变更都能独立审核；服务团队仍希望一次声明同时表达资源和访问需求。审批可以等待，但未经批准的权限不得生效。
  tests: 检验提交意图、批准与生效是否被误当成一个不可分动作；对象合并或拆分均可，但必须说明申请修改后旧批准是否仍有效，以及资源与权限的可见状态。
evaluation_criteria:
- 2—3个对象能表达资源意图、归属、实现进度及访问需求；按责任合并也可，无需凑齐固定对象名。
- 清楚区分用户可修改的意图与平台报告的执行状态，避免未经平台确认就承诺资源已存在。
- 接口不把某一云厂商标识强加为所有团队的业务契约；允许明确不支持的需求及拒绝路径。
- P1后能独立追踪权限变更对应的批准与生效，不让重交申请或修改内容绕过审批。
- 允许暂时只创建资源、整单等待或分步交付等不同选择，但调用方可知何时满足完整请求及失败怎样处理。
- 方案复杂度与题设相称，并能说清便利性、可移植性和审批粒度之间的取舍。
boundaries:
- 全题为合成场景；80个团队及P1的审批政策均为题设，不作为行业统计。
- 不要预设唯一的ResourceRequest/Grant或Deployment对象组合；满足约束的其他边界也有效。
- 首轮只给opening和initial_constraints，不提前公开P1或evaluation_criteria中的关键解法。
- 仅在用户提出初版边界后引入P1；不要额外添加区域数、吞吐、金额、厂商限制或全局原子性要求。
- 不要求参考实现；若认为某些目标不可兼得，可以明确条件并提出降级契约。
coach_notes:
  evidence_policy: 先接受最小对象草案；根据用户混淆的责任边界选择一个追问，再引入P1，不要求逐项背诵评分表。
  evaluation_focus:
  - 调用方能否知道申请得到的是受理承诺还是可用承诺。
  - 独立审批是否检查实际将生效的那一版权限，而不只是某次历史申请。
  optional_followup: 若用户提出单对象方案，先让其说明字段的修改者和批准对应的版本；若边界自洽，不因对象少而扣分。
